name: Leaderboard

# Rebuilds the contributor leaderboard issue ("🏆 Contributor leaderboard") every Monday, or on
# demand from the Actions tab. Rules: CONTRIBUTING.md ("Points and levels"); scoring:
# .github/scripts/leaderboard.py (tested in CI). It only reads PRs, reviews and issues and edits
# that one issue; it never checks out or runs contributor code.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/leaderboard.py --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
