name: Leaderboard

# Keeps the contributor leaderboard up to date:
# - when a PR is merged: refresh the board and comment on the PR with the points it earned
# - every Monday (and on demand): refresh the board
# "The board" is the "🏆 Contributor leaderboard" issue plus the README card, an SVG kept on the
# unprotected `leaderboard` branch, which only ever holds that one file.
# Rules: CONTRIBUTING.md ("Points and levels"). Scoring: .github/scripts/leaderboard.py (tested
# in CI).
#
# Security: pull_request_target runs with a write token, so this workflow checks out only
# .github/scripts from the default branch and never runs code from a pull request.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write       # the `leaderboard` branch (README card)
  issues: write         # the leaderboard issue and PR comments
  pull-requests: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  leaderboard:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Refresh the board
        if: github.event_name != 'pull_request_target'
        run: python3 .github/scripts/leaderboard.py --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Refresh the board and congratulate the PR
        if: github.event_name == 'pull_request_target'
        run: python3 .github/scripts/leaderboard.py --publish --celebrate "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
